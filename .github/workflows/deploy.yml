name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - claude/circuit-drawing-app-tx4Lh
  workflow_dispatch:
    inputs:
      reason:
        description: 'Anledning (för loggen)'
        required: false
        default: 'manuell körning'
      skip_tests:
        description: 'Hoppa över tester'
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - if: ${{ inputs.skip_tests != true }}
        run: npm test
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
